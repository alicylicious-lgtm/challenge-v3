<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- v1.0 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>⚡ Flex Challenge</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flex Challenge">
<meta name="theme-color" content="#0F1923">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#0F1923;
  --surface:#1A2533;
  --surface2:#222E3D;
  --border:#2A3A4D;
  --teal:#00C9A7;
  --teal-dim:#00C9A720;
  --teal-mid:#00C9A740;
  --blue:#4A9EFF;
  --text:#F0F4F8;
  --text-soft:#8A9BB0;
  --text-muted:#4A5A6D;
  --red:#FF5A5A;
  --gold:#FFB830;
  --green:#2ECC71;
  --radius:16px;
  --radius-sm:10px;
}
/* LIGHT THEME */
[data-theme="light"]{
  --bg:#F4F6F9;
  --surface:#FFFFFF;
  --surface2:#EEF1F5;
  --border:#D8DEE8;
  --teal:#00A388;
  --teal-dim:#00A38815;
  --teal-mid:#00A38830;
  --blue:#2E7FD9;
  --text:#1A2333;
  --text-soft:#5A6A80;
  --text-muted:#9AA5B5;
  --red:#E53535;
  --gold:#D4920A;
  --green:#1A9E50;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F4F6F9;
    --surface:#FFFFFF;
    --surface2:#EEF1F5;
    --border:#D8DEE8;
    --teal:#00A388;
    --teal-dim:#00A38815;
    --teal-mid:#00A38830;
    --blue:#2E7FD9;
    --text:#1A2333;
    --text-soft:#5A6A80;
    --text-muted:#9AA5B5;
    --red:#E53535;
    --gold:#D4920A;
    --green:#1A9E50;
  }
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:15px;overflow:hidden;}
#app{height:100%;display:flex;flex-direction:column;}

/* AUTH SCREENS */
.auth-screen{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;gap:24px;overflow-y:auto;
}
.auth-logo{font-size:56px;margin-bottom:8px;}
.auth-title{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--teal);text-align:center;}
.auth-sub{font-size:14px;color:var(--text-soft);text-align:center;line-height:1.6;}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;}
.auth-card h2{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.5px;}
.field input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
.field input:focus{border-color:var(--teal);}
.field input::placeholder{color:var(--text-muted);}
.btn{padding:13px 20px;border-radius:var(--radius-sm);border:none;font-size:15px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;text-align:center;}
.btn-primary{background:var(--teal);color:#0F1923;}
.btn-primary:hover{filter:brightness(1.1);}
.btn-primary:active{transform:scale(.97);}
.btn-ghost{background:transparent;color:var(--text-soft);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);}
.btn-danger{background:var(--red);color:white;}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--text-muted);font-size:13px;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.auth-link{color:var(--teal);cursor:pointer;font-size:14px;text-align:center;}
.auth-error{background:#FF5A5A20;border:1px solid #FF5A5A40;border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--red);display:none;}
.auth-error.show{display:block;}

/* MAIN APP */
.main-app{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.topbar-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:var(--teal);}
.topbar-user{display:flex;align-items:center;gap:8px;cursor:pointer;}
.avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:2px solid var(--teal);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--teal);flex-shrink:0;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}

.page{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px;}
.page::-webkit-scrollbar{display:none;}

/* BOTTOM NAV */
.bottom-nav{background:var(--surface);border-top:1px solid var(--border);display:flex;flex-shrink:0;z-index:10;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;cursor:pointer;transition:color .2s;color:var(--text-muted);border:none;background:none;font-family:'Inter',sans-serif;}
.nav-item.active{color:var(--teal);}
.nav-item svg{width:22px;height:22px;}
.nav-item span{font-size:10px;font-weight:500;}

/* CARDS */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-title{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.section-label{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 10px;}

/* HERO CARD */
.hero-card{background:linear-gradient(135deg,var(--surface2),var(--bg));border:1px solid var(--teal-mid);border-radius:var(--radius);padding:20px;margin-bottom:12px;position:relative;overflow:hidden;}
.hero-card::before{content:'⚡';position:absolute;right:-8px;top:-8px;font-size:90px;opacity:.06;}
.hero-name{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--teal);}
.hero-sub{font-size:13px;color:var(--text-soft);margin-top:2px;}
.hero-badges{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
.badge{background:rgba(0,201,167,.12);border:1px solid var(--teal-mid);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--teal);}

/* PROGRESS */
.progress-bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:8px 0;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:99px;transition:width .5s ease;}

/* TASK ROW */
.task-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--border);}
.task-info{flex:1;min-width:0;}
.task-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.score-btns{display:flex;gap:4px;flex-shrink:0;margin-left:8px;}
.task-row:last-child{border-bottom:none;}
.task-icon-wrap{width:40px;height:40px;border-radius:12px;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}

.task-name{font-weight:600;font-size:14px;line-height:1.3;white-space:normal;overflow:visible;}
.task-sub{font-size:11px;color:var(--text-muted);margin-top:2px;line-height:1.4;}
.score-btns{display:flex;gap:6px;}
.score-btn{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text-soft);font-size:13px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.score-btn.active-0{background:#FF5A5A20;border-color:var(--red);color:var(--red);}
.score-btn.active-1{background:#FFB83020;border-color:var(--gold);color:var(--gold);}
.score-btn.active-2{background:var(--teal-dim);border-color:var(--teal);color:var(--teal);}
.score-btn.active-3{background:var(--teal-dim);border-color:var(--teal);color:var(--teal);}
.score-btn.active-photo{background:#4A9EFF20;border-color:var(--blue);color:var(--blue);}

/* DAY BADGE */
.day-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700;}
.day-badge.great{background:var(--teal-dim);color:var(--teal);border:1px solid var(--teal-mid);}
.day-badge.ok{background:#FFB83020;color:var(--gold);border:1px solid #FFB83040;}
.day-badge.miss{background:#FF5A5A20;color:var(--red);border:1px solid #FF5A5A40;}
.day-badge.cc{background:#9B59B620;color:#9B59B6;border:1px solid #9B59B640;}

/* LEADERBOARD */
.lb-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);}
.lb-row:last-child{border-bottom:none;}
.lb-rank{width:28px;text-align:center;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--text-muted);}
.lb-rank.top1{color:var(--gold);}
.lb-rank.top2{color:#C0C0C0;}
.lb-rank.top3{color:#CD7F32;}
.lb-info{flex:1;}
.lb-name{font-weight:600;font-size:14px;}
.lb-pts{font-size:12px;color:var(--text-soft);}
.lb-score{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;color:var(--teal);}
.lb-me{background:var(--teal-dim);border-radius:var(--radius-sm);margin:-2px -4px;padding:2px 4px;}

/* CHAT */
.chat-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden;}
.chat-tabs{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto;flex-shrink:0;}
.chat-tabs::-webkit-scrollbar{display:none;}
.chat-tab{padding:6px 14px;border-radius:99px;font-size:13px;font-weight:600;border:1.5px solid var(--border);background:transparent;color:var(--text-soft);cursor:pointer;white-space:nowrap;transition:all .2s;}
.chat-tab.active{background:var(--teal);border-color:var(--teal);color:#0F1923;}
.chat-messages{flex:1;overflow-y:auto;padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.chat-messages::-webkit-scrollbar{display:none;}
.msg{display:flex;flex-direction:column;max-width:80%;}
.msg.mine{align-self:flex-end;align-items:flex-end;}
.msg.theirs{align-self:flex-start;align-items:flex-start;}
.msg-author{font-size:11px;color:var(--text-muted);margin-bottom:3px;font-weight:600;}
.msg-bubble{padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.5;}
.msg.mine .msg-bubble{background:var(--teal);color:#0F1923;border-bottom-right-radius:4px;}
.msg.theirs .msg-bubble{background:var(--surface2);color:var(--text);border-bottom-left-radius:4px;}
.msg-time{font-size:10px;color:var(--text-muted);margin-top:3px;}
.chat-input-wrap{padding:12px 16px;background:var(--surface);border-top:1px solid var(--border);display:flex;gap:10px;flex-shrink:0;}
.chat-input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:10px 16px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;}
.chat-input:focus{border-color:var(--teal);}
.chat-send{width:40px;height:40px;border-radius:50%;background:var(--teal);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-action-btn{width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px;transition:all .2s;}
.chat-action-btn:hover{border-color:var(--teal);}
.emoji-picker{position:fixed;bottom:80px;left:8px;right:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;z-index:50;display:none;box-shadow:0 -4px 24px rgba(0,0,0,.3);}
.emoji-picker.show{display:block;}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:160px;overflow-y:auto;}
.emoji-item{font-size:22px;text-align:center;cursor:pointer;padding:4px;border-radius:8px;transition:background .15s;}
.emoji-item:hover{background:var(--surface2);}
.gif-picker{position:fixed;bottom:80px;left:8px;right:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;z-index:50;display:none;box-shadow:0 -4px 24px rgba(0,0,0,.3);max-height:60vh;overflow-y:auto;}
.gif-picker.show{display:block;}
.gif-search{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:99px;padding:8px 14px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;outline:none;margin-bottom:10px;}
.gif-search:focus{border-color:var(--teal);}
.gif-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.gif-item{border-radius:var(--radius-sm);overflow:hidden;cursor:pointer;aspect-ratio:16/9;}
.gif-item img{width:100%;height:100%;object-fit:cover;}
.msg-gif{max-width:200px;border-radius:var(--radius-sm);overflow:hidden;}
.msg-gif img{width:100%;display:block;}

/* PROFILE PAGE */
.profile-header{display:flex;flex-direction:column;align-items:center;padding:24px 16px 16px;gap:12px;}
.profile-avatar{width:80px;height:80px;border-radius:50%;border:3px solid var(--teal);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;cursor:pointer;position:relative;}
.profile-avatar img{width:100%;height:100%;object-fit:cover;}
.profile-avatar-edit{position:absolute;bottom:0;right:0;background:var(--teal);border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:12px;}
.profile-name{font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;}
.profile-email{font-size:13px;color:var(--text-muted);}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.stat-card{background:var(--surface2);border-radius:var(--radius-sm);padding:14px;text-align:center;}
.stat-val{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--teal);}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:2px;}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--surface2);border:1px solid var(--teal-mid);border-radius:99px;padding:10px 20px;font-size:13px;font-weight:600;color:var(--teal);z-index:999;transition:transform .3s ease;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* QUOTE CARD */
.quote-card{background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;}
.quote-label{font-size:10px;font-weight:700;color:var(--teal);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.quote-text{font-size:15px;font-style:italic;line-height:1.6;color:var(--text-soft);}
.quote-deco{position:absolute;right:12px;top:12px;font-size:32px;opacity:.15;}

/* CC */
.cc-toggle{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:var(--radius-sm);cursor:pointer;border:1.5px solid var(--border);transition:all .2s;}
.cc-toggle.active{border-color:#9B59B6;background:#9B59B610;}
.toggle-dot{width:44px;height:26px;border-radius:99px;background:var(--border);position:relative;transition:background .2s;flex-shrink:0;}
.toggle-dot::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:white;top:3px;left:3px;transition:left .2s;}
.cc-toggle.active .toggle-dot{background:#9B59B6;}
.cc-toggle.active .toggle-dot::after{left:21px;}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:16px;}
.loading-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.modal-overlay.show{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border-radius:var(--radius) var(--radius) 0 0;padding:24px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;}
.modal-overlay.show .modal{transform:translateY(0);}
.modal-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;margin-bottom:16px;}
.modal-close{float:right;background:none;border:none;color:var(--text-muted);font-size:20px;cursor:pointer;margin-top:-4px;}

/* DM CHAT */
.dm-list{display:flex;flex-direction:column;gap:2px;}
.dm-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .15s;}
.dm-item:hover{background:var(--surface2);}
.dm-name{font-weight:600;font-size:14px;}
.dm-preview{font-size:12px;color:var(--text-muted);margin-top:2px;}
.dm-time{font-size:11px;color:var(--text-muted);flex-shrink:0;}
.unread-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);flex-shrink:0;}

/* INFO POPUP */
.info-btn{background:none;border:1.5px solid var(--text-muted);border-radius:50%;width:20px;height:20px;font-size:10px;font-weight:700;color:var(--text-muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;margin-left:4px;}
.info-btn:hover{border-color:var(--teal);color:var(--teal);}
.info-popup{background:var(--surface2);border:1px solid var(--teal-mid);border-radius:var(--radius);padding:16px;margin-top:8px;display:none;font-size:13px;line-height:1.6;color:var(--text-soft);}
.info-popup.show{display:block;}
.info-source{font-size:11px;color:var(--teal);margin-top:8px;font-style:italic;}

/* WATER GOAL */
.water-goal-link{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--teal-dim);border:1px solid var(--teal-mid);border-radius:var(--radius-sm);font-size:13px;color:var(--teal);cursor:pointer;text-decoration:none;margin-bottom:10px;}

/* SCROLLBAR */
::-webkit-scrollbar{width:0;}
</style>
</head>

</div>
<div class="toast" id="toast"></div>

// ─── CONFIG ───────────────────────────────────────────────

function getUserStart(uid){
  const u=allUsers[uid]||currentUserData;

function getUserDayIdx(uid){
  const start=getUserStart(uid);
  const diff=Math.floor((new Date()-start)/(1000*60*60*24));
  return Math.max(0,diff);
}

// ─── HELPERS ──────────────────────────────────────────────
function getToday(uid){
  uid=uid||currentUser?.uid;
  return getUserDayIdx(uid);
}
function formatDate(d){return d.toLocaleDateString('de-AT',{day:'2-digit',month:'2-digit',year:'numeric'});}
function dayScore(data){
  if(!data) return 0;
  return TASKS.reduce((s,t)=>{const v=data[t.key];return s+(typeof v==='number'?v:0);},0);
}
function totalScore(uid){
  if(!challengeData[uid]) return 0;
  return Object.values(challengeData[uid]).reduce((s,d)=>s+dayScore(d),0);
}
function totalGoal(uid){
  const days=Math.max(1,getUserDayIdx(uid));
  return Math.round(days*MAX_PTS*0.6);
}
function getInitials(name){return (name||'?').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
function getDayData(uid,idx){
  return challengeData[uid]?.[idx]||{water:null,schritte:null,training:null,sugar:null,read:null,photo:null,note:'',cc:false};
}

    html+=`<div class="lb-row ${isMe?'lb-me':''}">

  const today = getToday();
  let streak=0;
  for(let i=today;i>=0;i--){
    const d=getDayData(uid,i);

  const url = currentUserData?.photoURL||allUsers[uid]?.photoURL;

  return `<div class="profile-header">

// ─── NAVIGATION ───────────────────────────────────────────
function navigate(page){
  try{
    currentPage = page;
    if(chatUnsub){chatUnsub();chatUnsub=null;}
    const app = document.getElementById('mainApp');
    if(!app) return;
    app.querySelector('.bottom-nav').querySelectorAll('.nav-item').forEach((el,i)=>{
      el.classList.toggle('active',['home','days','leaderboard','chat','profile'][i]===page);
    });
    const content = document.getElementById('pageContent');
    if(page==='home') content.innerHTML=renderHome();
    else if(page==='days') content.innerHTML=renderDays();
    else if(page==='leaderboard') content.innerHTML=renderLeaderboard();
    else if(page==='chat'){content.innerHTML=renderChat();setTimeout(()=>loadChat(),100);}
    else if(page==='profile') content.innerHTML=renderProfile();
  } catch(err){
    console.error('navigate error:', err);
    const content = document.getElementById('pageContent');
    if(content) content.innerHTML=`<div style="padding:24px;color:var(--red);background:var(--surface);border-radius:16px;margin:16px;font-size:13px;line-height:1.8;">
      <strong>⚠️ Fehler beim Laden</strong><br>${err.message}<br><br>
      <small style="color:var(--text-muted);">${err.stack?.split('\n').slice(0,3).join('<br>')}</small>
    </div>`;
  }
}

async function loadChat(){
  if(chatUnsub) chatUnsub();
  const chatPath = activeChatId==='group'?'groupChat':activeChatId;
  const q2 = query(collection(db,'chats',chatPath,'messages'),orderBy('ts'));
  chatUnsub = onSnapshot(q2,snap=>{
    const msgs = document.getElementById('chatMessages');
    if(!msgs) return;
    if(snap.empty){msgs.innerHTML=`<div style="text-align:center;color:var(--text-muted);padding:40px;font-size:13px;">Noch keine Nachrichten ✨</div>`;return;}
    msgs.innerHTML = snap.docs.map(d=>{
      const m=d.data();
      const mine=m.uid===currentUser.uid;
      const ts=m.ts?.toDate?.()?m.ts.toDate().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}):'';
      const bubbleContent = m.gifUrl
        ? `<div class="msg-gif"><img src="${m.gifUrl}" alt="GIF" loading="lazy"></div>`
        : `<div class="msg-bubble">${m.text}</div>`;
      return `<div class="msg ${mine?'mine':'theirs'}">
        ${!mine?`<div class="msg-author">${allUsers[m.uid]?.displayName||m.uid}</div>`:''}
        ${bubbleContent}
        <div class="msg-time">${ts}</div>
      </div>`;
    }).join('');
    msgs.scrollTop=msgs.scrollHeight;
  });
}

async function setScore(key, val){
  const today = getToday();
  const ref2 = doc(db,'challenge',currentUser.uid,'days',String(today));
  const current = getDayData(currentUser.uid, today);
  current[key] = val;
  if(!challengeData[currentUser.uid]) challengeData[currentUser.uid]={};
  challengeData[currentUser.uid][today]=current;
  await setDoc(ref2, current, {merge:true});
  navigate('days');
  const sc=dayScore(current);
  if(sc>=MAX_PTS) showToast('🌟 Perfekter Tag!');
  else if(sc>=DAY_GOAL) showToast('✓ Tagesziel erreicht!');
}

async function toggleCC(){
  const today=getToday();
  const ref2=doc(db,'challenge',currentUser.uid,'days',String(today));
  const current=getDayData(currentUser.uid,today);
  current.cc=!current.cc;
  if(!challengeData[currentUser.uid]) challengeData[currentUser.uid]={};
  challengeData[currentUser.uid][today]=current;

// ─── DATA LOADING ─────────────────────────────────────────
async function loadAllData(uid){
  // Load all users
  const usersSnap = await getDocs(collection(db,'users'));
  allUsers={};
  usersSnap.forEach(d=>{allUsers[d.id]=d.data();});

  // Load my challenge data
  const myDays = await getDocs(collection(db,'challenge',uid,'days'));
  challengeData={};
  challengeData[uid]={};
  myDays.forEach(d=>{challengeData[uid][d.id]=d.data();});

  // Load others' challenge data
  for(const ouid of Object.keys(allUsers)){
    if(ouid===uid) continue;
    const snap=await getDocs(collection(db,'challenge',ouid,'days'));
    challengeData[ouid]={};
    snap.forEach(d=>{challengeData[ouid][d.id]=d.data();});
  }

  // Listen for realtime updates on my data
  onSnapshot(collection(db,'challenge',uid,'days'),snap=>{
    challengeData[uid]={};
    snap.forEach(d=>{challengeData[uid][d.id]=d.data();});
    if(currentPage==='home') navigate('home');
    if(currentPage==='days') navigate('days');
    if(currentPage==='leaderboard') navigate('leaderboard');
  });
}

      if(!user.displayName&&currentUserData.displayName){

      currentUserData={displayName:user.displayName||user.email.split('@')[0],waterGoal:2.0};

    navigate('home');

    initNotifications();
  } else {
    currentUser=null;currentUserData=null;
    document.getElementById('app').innerHTML=renderLogin();
  }
});

function setupLocalNotifications(){
  // Schedule daily reminder at 21:00
  function scheduleReminder(){
    const now = new Date();
    const reminder = new Date();
    reminder.setHours(21,0,0,0);
    if(reminder<=now) reminder.setDate(reminder.getDate()+1);
    const ms = reminder-now;
    setTimeout(async()=>{
      const today = getToday();
      const data = getDayData(currentUser.uid, today);
      const sc = dayScore(data);
      if(sc<DAY_GOAL && Notification.permission==='granted'){
        new Notification('⚡ Flex Challenge', {
          body: `Du hast heute erst ${sc}/${MAX_PTS} Punkte. Noch Zeit bis Mitternacht! 💪`,
          icon: '/icon192.png',
          tag: 'daily-reminder'
        });
      }
      scheduleReminder(); // reschedule for next day
    }, ms);
  }
  scheduleReminder();

  // Morning recap at 08:00
  function scheduleMorningRecap(){
    const now = new Date();
    const morning = new Date();
    morning.setHours(8,0,0,0);
    if(morning<=now) morning.setDate(morning.getDate()+1);
    const ms = morning-now;
    setTimeout(async()=>{
      const yesterday = getToday()-1;
      if(yesterday>=0){
        const data = getDayData(currentUser.uid, yesterday);
        const sc = dayScore(data);
        if(sc===0 && Notification.permission==='granted'){
          new Notification('📅 Flex Challenge', {
            body: 'Hast du gestern alles eingetragen? Du kannst noch nachtragen!',
            icon: '/icon192.png',
            tag: 'morning-recap'
          });
        }
      }
      scheduleMorningRecap();
    }, ms);
  }
  scheduleMorningRecap();
}

function checkLeaderboardChanges(){
  const sorted = Object.entries(allUsers)

    .sort((a,b)=>b.score-a.score);
  const myRank = sorted.findIndex(p=>p.uid===currentUser.uid)+1;
  const savedRank = parseInt(localStorage.getItem('myLastRank')||'99');
  
  if(myRank===1 && savedRank!==1 && Notification.permission==='granted'){
    new Notification('🥇 Du führst!', {
      body: 'Du bist jetzt auf Platz 1 der Rangliste! Weiter so! 🏆',
      icon: '/icon192.png',
      tag: 'rank-change'

  } else if(myRank>savedRank && savedRank!==99 && Notification.permission==='granted'){
    const overtaker = sorted[myRank-2];
    const name = allUsers[overtaker?.uid]?.displayName||'Jemand';
    new Notification('📉 Überholt!', {
      body: `${name} hat dich überholt und ist jetzt vor dir. Zeit aufzuholen! 💪`,
      icon: '/icon192.png',
      tag: 'overtaken'
    });

}

    new Notification(`🎉 Tag ${today} geschafft!`, {
      body: today===7?'Eine Woche dabei! Du bist großartig! 🌟':
            today===14?'Zwei Wochen Konstistenz! Beeindruckend! 🔥':
            today===21?'21 Tage — eine Gewohnheit ist geboren! 💪':
            today===30?'Ein Monat! Du bist unaufhaltsam! 🏆':
            `Tag ${today} — du machst das fantastisch! ⚡`,
      icon: '/icon192.png',
      tag: 'milestone'
    });
  }
}

// Listen for incoming messages when app is open
function setupMessageListener(){
  if(!messaging) return;
  onMessage(messaging, (payload)=>{
    const {title,body} = payload.notification||{};
    if(title) showToast(`🔔 ${body||title}`);
  });
}

async function initNotifications(){
  if(Notification.permission==='default'){
    // Show prompt after short delay
    setTimeout(async()=>{
      const granted = await requestNotificationPermission();
      if(granted){
        setupLocalNotifications();
        checkStreakDanger();
        checkMilestones();
        checkLeaderboardChanges();
        setupMessageListener();
        showToast('🔔 Benachrichtigungen aktiviert!');
      }
    }, 3000);
  } else if(Notification.permission==='granted'){
    setupLocalNotifications();
    checkStreakDanger();
    checkMilestones();
    checkLeaderboardChanges();
    setupMessageListener();
  }
}

              '✨','🌟','💯','🙌','😎','🤩','😴','😤','🥳','😇',

              '🍕','🥗','💧','🏃','🧘','📚','🎵','🌸','🦋','🌺'];

const GIPHY_KEY = 'mqion71jTMROLqYlZEdwmuDr0UQpp5Bu'; // public beta key

window.toggleEmojiPicker = ()=>{
  const ep=document.getElementById('emojiPicker');
  const gp=document.getElementById('gifPicker');
  if(!ep) return;
  gp?.classList.remove('show');
  if(!ep.classList.contains('show')){
    const grid=document.getElementById('emojiGrid');
    if(grid) grid.innerHTML=EMOJIS.map(e=>`<div class="emoji-item" onclick="insertEmoji('${e}')">${e}</div>`).join('');
  }
  ep.classList.toggle('show');
};

window.toggleGifPicker = ()=>{
  const gp=document.getElementById('gifPicker');
  const ep=document.getElementById('emojiPicker');
  if(!gp) return;
  ep?.classList.remove('show');
  gp.classList.toggle('show');
  if(gp.classList.contains('show')){
    searchGifs('happy');
  }
};

window.insertEmoji = (emoji)=>{
  const inp=document.getElementById('chatInput');
  if(inp){inp.value+=emoji;inp.focus();}
  document.getElementById('emojiPicker')?.classList.remove('show');
};

window.searchGifs = async(query)=>{
  if(!query||query.length<2) return;
  const grid=document.getElementById('gifGrid');
  if(!grid) return;
  grid.innerHTML='<div style="text-align:center;color:var(--text-muted);padding:20px;grid-column:1/-1;">Suche…</div>';
  try{
    const res=await fetch(`https://api.giphy.com/v1/gifs/search?api_key=${GIPHY_KEY}&q=${encodeURIComponent(query)}&limit=12&rating=g`);
    const data=await res.json();
    if(!data.data?.length){grid.innerHTML='<div style="text-align:center;color:var(--text-muted);padding:20px;grid-column:1/-1;">Keine GIFs gefunden</div>';return;}
    grid.innerHTML=data.data.map(g=>`
      <div class="gif-item" onclick="sendGif('${g.images.fixed_height_small.url}','${g.images.original.url}')">
        <img src="${g.images.fixed_height_small.url}" alt="${g.title}" loading="lazy">
      </div>`).join('');
  }catch(e){grid.innerHTML='<div style="text-align:center;color:var(--red);padding:20px;grid-column:1/-1;">Fehler beim Laden</div>';}
};

window.sendGif = async(previewUrl, originalUrl)=>{
  document.getElementById('gifPicker')?.classList.remove('show');
  const chatPath=activeChatId==='group'?'groupChat':activeChatId;
  await addDoc(collection(db,'chats',chatPath,'messages'),{
    uid:currentUser.uid,
    text:'',
    gifUrl:originalUrl,
    ts:serverTimestamp()
  });
};

// Close pickers when clicking outside
document.addEventListener('click',(e)=>{
  if(!e.target.closest('.emoji-picker')&&!e.target.closest('.chat-action-btn')){
    document.getElementById('emojiPicker')?.classList.remove('show');
  }
  if(!e.target.closest('.gif-picker')&&!e.target.closest('.chat-action-btn')){
    document.getElementById('gifPicker')?.classList.remove('show');
  }
});
